x-php-build: &php-build
  build:
    context: ./docker/local/php
    dockerfile: Dockerfile
    args:
      - BASE_IMAGE=php:${PHP_VERSION}-alpine

x-php-volume: &php-volume
  volumes:
    - .:/var/www/html

x-php-depends: &php-depends
  depends_on:
    database:
      condition: service_healthy
    store:
      condition: service_healthy
    s3:
      condition: service_healthy

x-s3-volume: &s3-volume
  volumes:
    - s3:/data

x-healthcheck: &healthcheck
  interval: 5s
  timeout: 5s
  retries: 5

services:
  app:
    build:
      context: ./docker/local/php
      dockerfile: Dockerfile
      args:
        - BASE_IMAGE=php:${PHP_VERSION}-fpm-alpine
    expose:
      - 9000
    <<: [ *php-volume, *php-depends ]

  webserver:
    image: nginx:stable
    ports:
      - "${WEBSERVER_PORT:-80}:80"
    volumes:
      - ./docker/local/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./docker/local/nginx/nginx.conf:/etc/nginx/nginx.conf
      - .:/var/www/html
    depends_on:
      app:
        condition: service_started
      horizon:
        condition: service_healthy

  cli:
    <<: [ *php-build, *php-volume ]

  schedule:
    <<: [ *php-build, *php-volume, *php-depends ]
    command: /bin/sh -c 'php /var/www/html/artisan schedule:work'

  horizon:
    <<: [ *php-build, *php-volume, *php-depends ]
    command: /bin/sh -c 'php /var/www/html/artisan horizon'
    healthcheck:
      test: [ "CMD", "php", "/var/www/html/artisan", "horizon:status" ]
      <<: [ *healthcheck ]

  database:
    image: postgres:alpine
    restart: always
    ports:
      - "${DATABASE_PORT:-5432}:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USERNAME}
      - POSTGRES_DB=${POSTGRES_DATABASE}
      - POSTGRES_HOST_AUTH_METHOD=trust
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USERNAME} -d ${POSTGRES_DATABASE}" ]
      <<: [ *healthcheck ]

  store:
    image: redis:alpine
    ports:
      - "${STORE_PORT:-6379}:6379"
    volumes:
      - store:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      <<: [ *healthcheck ]

  s3:
    image: minio/minio:latest
    ports:
      - "${S3_PORT:-9000}:9000"
    environment:
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
      - MINIO_REGION_NAME=${MINIO_REGION_NAME}
    command: server /data --console-address ":9001"
    <<: *s3-volume
    healthcheck:
      test: [ "CMD", "mc", "ready", "local" ]
      <<: *healthcheck

  s3-cli:
    image: minio/mc:latest
    <<: *s3-volume
    depends_on:
      s3:
        condition: service_healthy

  node:
    image: node:lts
    working_dir: /var/app
    volumes:
      - .:/var/app

volumes:
  database:
    driver: local
  store:
    driver: local
  s3:
    driver: local

networks:
  default:
    name: "${IDENTIFIER}-network"
    driver: bridge
